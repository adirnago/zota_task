name: Build & Deploy

on:
  push:
    branches:
      - main
      - feature/create_dockerfile

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: 505342849790.dkr.ecr.eu-central-1.amazonaws.com
  ECR_REPOSITORY: asset-proxy
  STACK_NAME: asset-proxy
  LAMBDA_FUNCTION_NAME: asset-proxy-handler

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.set-output.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Set image URI output
        id: set-output
        run: |
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation stack
        run: |
          set -e
          aws cloudformation deploy \
            --template-file infrastructure.yml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM \
            --region $AWS_REGION \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ECRImageURI=${{ needs.build.outputs.image_uri }} || true

          echo "=== Stack Events ==="
          aws cloudformation describe-stack-events \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,ResourceType,ResourceStatusReason]' \
            --output table

          echo "=== Stack Status ==="
          aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --query 'Stacks[0].StackStatus' \
            --output text

      - name: Update Lambda function image
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --image-uri ${{ needs.build.outputs.image_uri }} \
            --region $AWS_REGION  