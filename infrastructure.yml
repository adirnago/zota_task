AWSTemplateFormatVersion: '2010-09-09'
Description: Asset Proxy Infrastructure - S3 private + Lambda container + Lambda Function URL + CloudFront Distribution + IAM Roles.

Parameters:
  GitHubOrg:
    Type: String
    Default: adirnago
    Description: GitHub organisation or username that owns the repo

  GitHubRepo:
    Type: String
    Default: zota_task
    Description: GitHub repository name (without the org prefix)

  ECRImageURI:
    Type: String
    Default: public.ecr.aws/lambda/provided:al2023
    Description: Full ECR image URI for the Lambda function.

Resources:

  AssetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'asset-proxy-store-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-asset-proxy-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub 'arn:aws:s3:::asset-proxy-store-${AWS::AccountId}/*'

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-asset-proxy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/*'
      Policies:
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/asset-proxy'
        - PolicyName: LambdaUpdate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:asset-proxy-*'
        - PolicyName: CloudFormationDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'

  AssetProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: asset-proxy-handler
      PackageType: Image
      Code:
        ImageUri: !Ref ECRImageURI
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          BUCKET_NAME: !Sub 'asset-proxy-store-${AWS::AccountId}'

  AssetProxyFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AssetProxyLambda.Arn
      AuthType: NONE
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET

  LambdaFunctionUrlAllowPublicAccess:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AssetProxyLambda.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  AssetProxyDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Asset Proxy CDN - CloudFront Distribution
        Enabled: true
        HttpVersion: http2
        DefaultCacheBehavior:
          TargetOriginId: LambdaFunctionUrl
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
        Origins:
          - Id: LambdaFunctionUrl
            DomainName: !Select
              - 2
              - !Split ['/', !GetAtt AssetProxyFunctionUrl.FunctionUrl]
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100

Outputs:
  AssetBucketName:
    Description: Name of the private S3 bucket
    Value: !Ref AssetBucket

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AssetProxyLambda.Arn

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref AssetProxyLambda

  GitHubActionsRoleArn:
    Description: Paste this ARN as the AWS_ROLE_ARN secret in your GitHub repo settings.
    Value: !GetAtt GitHubActionsRole.Arn

  CloudFrontURL:
    Description: Public CloudFront URL
    Value: !Sub 'https://${AssetProxyDistribution.DomainName}'

  LambdaFunctionURL:
    Description: Direct Lambda Function URL
    Value: !GetAtt AssetProxyFunctionUrl.FunctionUrl