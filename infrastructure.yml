AWSTemplateFormatVersion: '2010-09-09'
Description: Asset Proxy Infrastructure - S3 + Lambda + CloudFront

Parameters:
  ECRImageURI:
    Type: String
    Description: ECR image URI for the Lambda function.

Resources:

  AssetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'asset-proxy-store-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-asset-proxy-lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadAssets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::asset-proxy-store-${AWS::AccountId}/*'

  AssetProxyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: asset-proxy-handler
      PackageType: Image
      Code:
        ImageUri: !Ref ECRImageURI
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          BUCKET_NAME: !Sub 'asset-proxy-store-${AWS::AccountId}'

  AssetProxyFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AssetProxyLambda.Arn
      AuthType: AWS_IAM
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET

  LambdaFunctionUrlAllowPublicAccess:
    Type: AWS::Lambda::Permission
    DependsOn: AssetProxyDistribution
    Properties:
      FunctionName: !GetAtt AssetProxyLambda.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${AssetProxyDistribution}'
      FunctionUrlAuthType: AWS_IAM

  LambdaOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: LambdaOAC
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  AssetProxyDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Asset Proxy CDN
        Enabled: true
        HttpVersion: http2
        DefaultCacheBehavior:
          TargetOriginId: LambdaFunctionUrl
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
        Origins:
          - Id: LambdaFunctionUrl
            DomainName: !Select
              - 2
              - !Split ['/', !GetAtt AssetProxyFunctionUrl.FunctionUrl]
            OriginAccessControlId: !GetAtt LambdaOriginAccessControl.Id
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        PriceClass: PriceClass_100

Outputs:
  AssetBucketName:
    Description: Name of the private S3 bucket
    Value: !Ref AssetBucket

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AssetProxyLambda.Arn

  CloudFrontURL:
    Description: Public CloudFront URL
    Value: !Sub 'https://${AssetProxyDistribution.DomainName}'

  LambdaFunctionURL:
    Description: Direct Lambda Function URL
    Value: !GetAtt AssetProxyFunctionUrl.FunctionUrl